name: tally
version: "0.6.0"
description: Agent-native task management with CLI-driven ledger, round discipline, auto-retry, auto-next, JSON error output, and visualization
commands:
  - tally status
  - tally check
  - tally lint
  - tally round start
  - tally round close
  - tally round report
  - tally task add
  - tally task done
  - tally task evidence
  - tally task edit
  - tally task block
  - tally task unblock
  - tally task list
  - tally task show
  - tally task approve
  - tally task link-plan
  - tally plan register
  - tally plan list
  - tally plan check
  - tally sync
  - tally graph
  - tally export
  - tally dashboard
  - tally init
  - tally upgrade
  - tally audit evidence
  - tally repair missing-evidence
  - tally migrate
rules:
  - Never edit .tally/tally.json directly -- always use CLI
  - Always prefer batch forms (multiple IDs in one command)
  - New tasks discovered during execution go into the ledger, not the current round
  - Before commit, run tally lint
  - Open tasks must have a feature assigned (FEATURE_REQUIRED)
  - High/critical risk tasks need rollback plan and review flag
  - Round start validates write scopes, risk gates, feature freeze, and approval
  - Use structured evidence on task done (--test, --commit, --review, --provider, --notes)
  - Use tally task evidence or tally repair missing-evidence only for honest historical evidence backfill on done tasks
  - Never overwrite existing done-task evidence without explicit --append or --replace
  - Use tally plan check before executing tasks linked to implementation plans
  - Choose round strategy wisely: feature-focused for cohesion, risk-first for priority, parallel-max for throughput
round_strategies:
  - parallel-max: maximize parallelism, group by module then feature (default)
  - feature-focused: complete one feature before moving to the next
  - risk-first: highest risk tasks first
safety_checks:
  - write_scope_conflict: rejects overlapping writeScopes in same round
  - risk_gating: rejects tasks above configured maxRisk
  - feature_freeze: only contract/test tasks allowed on frozen features
  - approval_gate: unapproved high/critical tasks rejected
  - dependency_satisfaction: all deps must be done
task_fields:
  core: [id, status, priority, stage, module, name, acceptance, feature, deps, blocks, nextAction, evidence, rule, tags]
  scheduling: [writeScopes, riskLevel, executionLane, requiresReview, rollbackPlan, assignedAgent, approvedBy]
  planning: [acceptanceCriteria, executionPlan, planRef, planPath, planTaskRef, planContentHash]
  tracking: [resourceRequirements, repos, deliveryNode]
plan_registry:
  purpose: Link Tally tasks to external implementation plans without replacing those plans
  fields: [id, path, title, kind, requiredSkill, contentHash, status, registeredAt, updatedAt]
  statuses: [active, archived, superseded]
  commands: [tally plan register, tally task link-plan, tally plan check, tally export --format agent-brief]
feature_registry:
  fields: [id, module, name, status, specRefs, dependsOn, owner]
  statuses: [design, contract_frozen, implementing, stable]
structured_evidence:
  flags: [--evidence, --test, --commit, --review, --provider, --notes]
historical_evidence_repair:
  commands: [tally audit evidence, tally task evidence, tally repair missing-evidence]
  dry_run: tally repair missing-evidence --dry-run --json
  safety:
    - only_done_tasks
    - no_default_overwrite
    - no_completion_fact_changes
    - requires_review_needs_review_flag_or_allow_missing_review
  honest_evidence_examples:
    test: not rerun during repair
    review: missing prior review evidence recorded
export_formats: [json, csv, markdown, agent-brief]
graph_levels: [task, feature]
